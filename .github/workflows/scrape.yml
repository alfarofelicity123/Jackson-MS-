name: Scrape motivated seller leads

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/index.html"
      - "data/clerk_import.csv"
      - "data/enrichment.csv"
      - "scraper/fetch.py"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml dbfread rapidfuzz playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          CLERK_URL: ${{ vars.CLERK_URL }}
          PARCEL_URL: ${{ vars.PARCEL_URL }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
        run: python scraper/fetch.py

      - name: Print results
        run: |
          echo "=== Scrape Results ==="
          python - <<'PY'
          import json
          d = json.load(open("data/records.json"))
          rs = d["records"]
          print("Total records:", d["total"])
          print("With address:", sum(1 for r in rs if r.get("prop_address") or r.get("mail_address")))
          print("Hot >=70:", sum(1 for r in rs if r.get("score", 0) >= 70))
          from collections import Counter
          print("By type:", dict(Counter(r.get("cat") for r in rs)))
          print("Match confidence:", dict(Counter(r.get("match_confidence") for r in rs)))
          PY

      - name: Upload debug artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: data/debug/
          if-no-files-found: ignore

      # A failed push must never block the website from updating.
      - name: Commit and push records
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/ghl_export.csv data/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update leads $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # -X theirs = keep the freshly generated files if there is a conflict
            if git rebase -X theirs "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          echo "Could not push after 3 tries (site will still deploy)"
          exit 1

      - name: Log result
        if: failure()
        run: echo "::error::Scraper failed - open the failed step above and read the log"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
